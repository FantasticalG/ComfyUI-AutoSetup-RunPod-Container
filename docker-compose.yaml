services:
  comfy:
    build: .
    container_name: comfy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      # Optional overrides
      SETUP_REPO: https://github.com/FantasticalG/ComfyUI-AutoSetup-Script
      COMFY_DIR: /workspace/ComfyUI
      SKIP_UPDATE: "0"
      CIVITAI_API_KEY: "${CIVITAI_API_KEY}"
      HUGGINGFACE_API_KEY: "${HUGGINGFACE_API_KEY}"
      # Optional model-download skip filters (empty = download all):
      #   SKIP_MODEL_FILES — by URL/filename, e.g. "wan,t2v;sdxl"
      #   SKIP_MODEL_DIRS  — by target folder name, e.g. "qwen;sdxl"
      SKIP_MODEL_FILES: "${SKIP_MODEL_FILES:-}"
      SKIP_MODEL_DIRS: "${SKIP_MODEL_DIRS:-}"
      # Extra ComfyUI launch flags; empty = entrypoint baseline (--reserve-vram 1 --max-upload-size 1024)
      COMFY_ARGS: "${COMFY_ARGS:-}"

    ports:
      - "8188:8188"   # ComfyUI
      - "8888:8888"   # JupyterLab

    volumes:
      # Everything installed into install dir = persistent
      - ./data:/workspace

    runtime: nvidia
